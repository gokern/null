version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gci
    - golines
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"

linters:
  default: all
  disable:
    - wsl # Deprecated, replaced by wsl_v5.
    - gomodguard # Deprecated, replaced by gomodguard_v2.
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/gokern/null
            - github.com/stretchr/testify
    ireturn:
      allow:
        - anon # anon..stdlib restate ireturn's defaults: `allow` replaces them wholesale
        - error
        - empty
        - stdlib
        - generic # Get/Or return the type parameter T
    varnamelen:
      ignore-names:
        - v # value parameter (From)
        - p # pointer parameter (FromPtr)
        - n # the Null receiver
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - exhaustruct
