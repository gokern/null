name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand
        env:
          # govulncheck 1.8.0 needs go >= 1.26 to build, while this module's
          # floor is 1.24; setup-go pins GOTOOLCHAIN=local, which would fail
          # the install. Let the tool BUILD fetch the toolchain it needs; the
          # tests themselves still run on the floor version.
          GOTOOLCHAIN: auto

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned in mise.toml [tools] — the same install CI and `mise run
          # lint` use locally. Bump it there, on purpose, together with any
          # config/code changes the new version demands.
          install-mode: none

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand
        env:
          # govulncheck 1.8.0 needs go >= 1.26 to build, while this module's
          # floor is 1.24; setup-go pins GOTOOLCHAIN=local, which would fail
          # the install. Let the tool BUILD fetch the toolchain it needs; the
          # tests themselves still run on the floor version.
          GOTOOLCHAIN: auto

      - name: Check go.mod is tidy
        run: mise run tidy
