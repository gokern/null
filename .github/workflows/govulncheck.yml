name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand
        env:
          # govulncheck 1.8.0 needs go >= 1.26 to build, while this module's
          # floor is 1.24; setup-go pins GOTOOLCHAIN=local, which would fail
          # the install. Let the tool BUILD fetch the toolchain it needs; the
          # tests themselves still run on the floor version.
          GOTOOLCHAIN: auto

      - name: govulncheck
        run: mise run vuln
